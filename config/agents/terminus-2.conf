# Agent profile: terminus-2
#
# Native agent — the harness makes LLM calls from the host, so it reaches
# llama-server on localhost directly. No extra harbor flags needed.
#
# Profile contract (sourced by bin/sweep.sh after the engine is loaded):
#   NET_MODE           "localhost" | "hostnet"
#   EXTRA_HARBOR_ARGS  array of extra args appended to `harbor run`
#   apply_agent_env    hook run after OPENAI_API_BASE is exported (extra env)
#   build_harbor_args  hook run after $ENDPOINT is known (populates EXTRA_HARBOR_ARGS)

NET_MODE="localhost"
EXTRA_HARBOR_ARGS=()

apply_agent_env() { :; }

build_harbor_args() {
  EXTRA_HARBOR_ARGS=()
}
