# Agent profile: openhands
#
# Containerized agent — runs inside Docker, so it cannot reach the model on
# the host via "localhost". The sweep uses host networking (the host IP), and
# the host endpoint is also injected into the agent via the `api_base`
# agent-kwarg so the container talks to llama-server on the host.
#
# See profile contract in config/agents/terminus-2.conf.

NET_MODE="hostnet"
EXTRA_HARBOR_ARGS=()

apply_agent_env() { :; }

build_harbor_args() {
  EXTRA_HARBOR_ARGS=( --ak "api_base=http://${ENDPOINT}:8000/v1" )
}
