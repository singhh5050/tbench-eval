# Agent profile: qwen-coder
#
# Containerized agent that reads OPENAI_BASE_URL (in addition to
# OPENAI_API_BASE). Uses host networking so the container reaches the model
# on the host; no api_base agent-kwarg required.
#
# See profile contract in config/agents/terminus-2.conf.

NET_MODE="hostnet"
EXTRA_HARBOR_ARGS=()

apply_agent_env() {
  export OPENAI_BASE_URL="http://${ENDPOINT}:8000/v1"
}

build_harbor_args() {
  EXTRA_HARBOR_ARGS=()
}
